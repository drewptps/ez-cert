<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Set Password — EZ-CERT</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #11161d;
      --border: #26303b;
      --text: #e5e7eb;
      --text-muted: #98a2b3;
      --heading: #f3f4f6;
      --primary: #d1d5db;
      --primary-text: #0b0f14;
      --primary-hover: #e5e7eb;
      --danger-bg: #2a1212;
      --danger-border: #8f3434;
      --danger-text: #f2aaaa;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
    }

    .logo-link {
      display: block;
      text-align: center;
      margin-bottom: 28px;
    }

    .app-title-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.8rem;
      letter-spacing: 0.08em;
      color: #f0ead8;
      text-shadow: 3px 3px 0 #c0392b, -1px -1px 0 #c0392b;
      line-height: 1;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      color: var(--heading);
      text-align: center;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
      color: var(--heading);
      font-size: 0.92rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #364152;
      border-radius: 8px;
      background: #0f141b;
      color: var(--text);
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #64748b;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 10px 14px;
      background: var(--primary);
      color: var(--primary-text);
      text-decoration: none;
      border-radius: 8px;
      border: 1px solid var(--primary);
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      text-align: center;
    }

    .button:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .error {
      margin-bottom: 16px;
      padding: 10px 12px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      border-radius: 8px;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="logo-link">
      <span class="app-title-text">EZ-CERT</span>
    </a>

    <div class="panel">
      <h1>Set Password</h1>
      <div class="subtitle">Create a password to protect EZ-CERT. This is a one-time setup.</div>

      {{if .Error}}
        <div class="error">{{.Error}}</div>
      {{end}}

      <form method="post" action="/password/setup">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autofocus required>

        <label for="confirm">Confirm Password</label>
        <input id="confirm" name="confirm" type="password" required>

        <button class="button" type="submit">Set Password</button>
      </form>
    </div>
  </div>
</body>
</html>
