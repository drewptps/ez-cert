<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Change Password — EZ-CERT</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #11161d;
      --border: #26303b;
      --text: #e5e7eb;
      --text-muted: #98a2b3;
      --heading: #f3f4f6;
      --primary: #d1d5db;
      --primary-text: #0b0f14;
      --primary-hover: #e5e7eb;
      --button-secondary-bg: #151b23;
      --button-secondary-hover: #1b2430;
      --success-bg: #0f1f16;
      --success-border: #1f6f43;
      --success-text: #8fe0af;
      --danger-bg: #2a1212;
      --danger-border: #8f3434;
      --danger-text: #f2aaaa;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .app-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .app-title {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .app-title-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.8rem;
      letter-spacing: 0.08em;
      color: #f0ead8;
      text-shadow: 3px 3px 0 #c0392b, -1px -1px 0 #c0392b;
      line-height: 1;
    }

    .app-bar-right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--heading);
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
      color: var(--heading);
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #364152;
      border-radius: 8px;
      background: #0f141b;
      color: var(--text);
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #64748b;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 14px;
      background: var(--primary);
      color: var(--primary-text);
      text-decoration: none;
      border-radius: 8px;
      border: 1px solid var(--primary);
      cursor: pointer;
      font: inherit;
      font-weight: bold;
    }

    .button:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .button-secondary {
      background: var(--button-secondary-bg);
      color: var(--text);
      border-color: var(--border);
      margin-top: 0;
    }

    .button-secondary:hover {
      background: var(--button-secondary-hover);
      border-color: #334155;
    }

    .error {
      margin-bottom: 16px;
      padding: 10px 12px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      border-radius: 8px;
    }

    .success {
      margin-bottom: 16px;
      padding: 10px 12px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="app-bar">
      <div class="app-bar-left">
        <a href="/" class="app-title"><span class="app-title-text">EZ-CERT</span></a>
      </div>
      <div class="app-bar-right">
        <a class="button button-secondary" href="/">Back to List</a>
      </div>
    </div>

    <h1>Change Password</h1>
    <div class="subtitle">Your new password takes effect immediately and signs you out.</div>

    <div class="panel">
      {{if .Error}}
        <div class="error">{{.Error}}</div>
      {{end}}
      {{if .Success}}
        <div class="success">{{.Success}}</div>
      {{end}}

      <form method="post" action="/password/change">
        <label for="current">Current Password</label>
        <input id="current" name="current" type="password" autofocus required>

        <label for="password">New Password</label>
        <input id="password" name="password" type="password" required>

        <label for="confirm">Confirm New Password</label>
        <input id="confirm" name="confirm" type="password" required>

        <button class="button" type="submit">Change Password</button>
      </form>
    </div>
  </div>
</body>
</html>
